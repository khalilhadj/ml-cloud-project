random_seed: 42

paths:
  raw: data/raw
  processed: data/processed
  models: models
  database: data/alerts.db

features:
  window_seconds: 60

model:
  n_estimators: 200
  contamination: auto
  max_samples: 1024

detection:
  threshold: 0.481472          # réglé à l'étape 5 sur le jeu de validation
  severity:
    low: 0.60
    medium: 0.70
    high: 0.80
  dedup_window_minutes: 10

retrain:
  schedule: weekly
  min_feedback: 20
