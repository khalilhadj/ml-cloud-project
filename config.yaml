random_seed: 42

paths:
  raw: data/raw
  processed: data/processed
  models: models
  database: data/alerts.db

features:
  window_seconds: 60

model:
  n_estimators: 200
  contamination: auto
  max_samples: 1024

detection:
  threshold: 0.473067          # réglé à l'étape 5 sur le jeu de validation
  target_fpr: 0.03             # FPR visé sur les normaux de validation
  severity:
    low: 0.473067
    medium: 0.532624
    high: 0.592182
  dedup_window_minutes: 10

retrain:
  schedule: weekly
  min_feedback: 20
