services:
  dashboard:
    build: { context: ., dockerfile: app-ml/Dockerfile }
    command: streamlit run dashboard/app.py --server.headless true --server.port 8501 --server.address 0.0.0.0
    ports: ["8501:8501"]
    env_file: .env
    volumes: ["appdata:/app/data", "appmodels:/app/models"]
    restart: unless-stopped
  scheduler:
    build: { context: ., dockerfile: app-ml/Dockerfile }
    command: python app-ml/scheduler.py
    env_file: .env
    volumes: ["appdata:/app/data", "appmodels:/app/models"]
    restart: unless-stopped
volumes:
  appdata:
  appmodels:
